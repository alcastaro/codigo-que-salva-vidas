<style>

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--off); color: var(--negro); font-family: var(--sans); line-height: 1.4; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: clamp(28px, 4vw, 40px); margin: 0; font-weight: 700; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; }
  .boton { display: inline-block; text-decoration: none; color: var(--negro); background: var(--blanco); border: 2px solid var(--negro);
           border-radius: 999px; padding: 8px 18px; font: 500 16px var(--sans); cursor: pointer; }
  .boton:hover, .boton:focus-visible { background: var(--negro); color: var(--blanco); outline: none; }
  .escenario { position: relative; aspect-ratio: 16 / 9; background: var(--blanco); border: 2px solid var(--negro); border-radius: 20px; overflow: hidden; }
  .escenario img { position: absolute; display: block; }
  .escenario .fondo { inset: 0; width: 100%; height: 100%; }
  .escenario img[hidden] { display: none; }
  .escenario:fullscreen { border: 0; border-radius: 0; background: var(--negro); }
  .escenario:fullscreen .lienzo { position: absolute; inset: 0; margin: auto; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  .lienzo { position: absolute; inset: 0; }
  .controles { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .contador { font: 300 16px var(--mono); }
  .ayuda { font: 300 13px var(--mono); margin-top: 24px; }
  a { color: var(--negro); }
  @media (max-width: 600px) {
    .boton { padding: 6px 14px; font-size: 15px; }
    #pantalla { display: none; }
    .escenario { border-radius: 12px; }
  }
</style>

taller de Climate Engine para analizar clima y satélite sin código. · gdg.community.dev/gdg-santo-domingo", "gif": null}, {"alt": "Llévatelo a casa · Notebooks y datos en el repo del QR Datos abiertos, con su licencia citada Alertas reales: tu servicio meteorológico ¿Construyes algo? Cuéntaselo al GDG", "gif": null}, {"alt": "Encuéntrame · LinkedIn · linkedin.com/in/alcastaro · Instagram · @alcastaro", "gif": null}, {"alt": "Gracias · Alberto Castillo Aroca github.com/alcastaro/codigo-que-salva-vidas", "gif": null}];
const pad = n => String(n).padStart(2, "0");
const fondo = document.getElementById("fondo"), anim = document.getElementById("anim");
const contador = document.getElementById("contador"), escenario = document.getElementById("escenario");
let i = 0;
function mostrar(n) {
  i = Math.max(0, Math.min(SLIDES.length - 1, n));
  const s = SLIDES[i];
  fondo.src = "diapositivas/" + pad(i + 1) + ".jpg";
  fondo.alt = s.alt;
  if (s.gif) {
    const [x, y, w, h, radio, linea] = s.gif;
    // The deck draws each GIF as a rounded picture with an ink outline; both scale with the slide.
    const ancho = document.getElementById("lienzo").clientWidth;
    const lado = Math.min(w / 100 * ancho, h / 100 * ancho * 9 / 16);
    Object.assign(anim.style, { left: x + "%", top: y + "%", width: w + "%", height: h + "%",
      borderRadius: radio * lado + "px", border: linea ? linea * ancho + "px solid var(--negro)" : "0", boxSizing: "border-box" });
    anim.src = "animaciones/" + pad(i + 1) + ".gif";
    anim.hidden = false;
  } else {
    anim.hidden = true;
    anim.removeAttribute("src");
  }
  contador.textContent = (i + 1) + " / " + SLIDES.length;
  history.replaceState(null, "", "#" + (i + 1));
  if (i + 1 < SLIDES.length) new Image().src = "diapositivas/" + pad(i + 2) + ".jpg";
}
function pantalla() {
  if (document.fullscreenElement) document.exitFullscreen();
  else escenario.requestFullscreen && escenario.requestFullscreen();
}
document.getElementById("prev").onclick = () => mostrar(i - 1);
document.getElementById("next").onclick = () => mostrar(i + 1);
document.getElementById("pantalla").onclick = pantalla;
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); mostrar(i + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); mostrar(i - 1); }
  else if (e.key === "Home") mostrar(0);
  else if (e.key === "End") mostrar(SLIDES.length - 1);
  else if (e.key === "f" || e.key === "F") pantalla();
});
let x0 = null;
escenario.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
escenario.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) mostrar(i + (dx < 0 ? 1 : -1));
});
escenario.addEventListener("click", e => { if (!e.target.closest("button")) mostrar(i + 1); });
window.addEventListener("resize", () => mostrar(i));
document.addEventListener("fullscreenchange", () => mostrar(i));
mostrar((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
